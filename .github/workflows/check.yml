name: check

# The repo's finish line (`make check`) on every push/PR: the style-linter's own tests,
# knowledge-graph integrity, and the example gates. Pure stdlib + pytest — no manim, no
# LaTeX — so it's fast and can never go green by silently skipping (fail-loud discipline).
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: make check
